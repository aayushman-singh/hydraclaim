name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Verify release tag matches project version
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: python scripts/verify_release_tag.py
      - run: python -m pip install -e ".[dev]" ruff build twine
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest tests/ -v -m "not artifact"
      - run: python -c "import shutil; shutil.rmtree('dist', ignore_errors=True)"
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python -m pytest tests/ -v -m artifact
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/hydraclaim
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@76f52bc884231f62b9a034ebfe128415bbaabdfc # v1.12.4
