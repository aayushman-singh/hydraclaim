name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Verify release tag matches project version
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: python scripts/verify_release_tag.py
      - run: python -m pip install -e . pytest ruff build twine
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest tests/ -v -m "not artifact"
      - run: python -c "import shutil; shutil.rmtree('dist', ignore_errors=True)"
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python -m pytest tests/ -v -m artifact
      - uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/hydraclaim
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
