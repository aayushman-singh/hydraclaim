# Local single-node HydraDB for HydraClaim development.
# Bring it up with scripts/dev-up.sh (creates hydradb-data/ and the auth token first).
#
# Endpoints once running:
#   Bolt   127.0.0.1:7687   (Neo4j-driver compatible)
#   HTTP   127.0.0.1:8443   (JSON query API — what hydraclaim.db uses)
#   Admin  127.0.0.1:9090   (/readyz, /metrics)
#
# On Linux, add `user: "$(id -u):$(id -g)"` to the service: the image runs as
# UID/GID 10001 but the bind-mounted hydradb-data/ is owned by the host user.
services:
  hydradb:
    image: ghcr.io/hydra-db/hydradb:latest
    ports:
      - "7687:7687"
      - "8443:8443"
      - "9090:9090"
    environment:
      CLOUD_PROVIDER: local
      LOCAL_PATH: /data/store
      GRAPH_NAMESPACE: default
      GRAPH_ID: default
      GRAPH_CELL_ID: cell-0
      GRAPH_CELLS: cell-0
      GRAPH_NODE_ID: node-0
      GRAPH_BOLT_NODE_ADDRESSES: node-0=127.0.0.1:7687
      GRAPH_ADVERTISED_BOLT_ADDR: 127.0.0.1:7687
      GRAPH_DATA_CACHE_DIR: /data/cache
      GRAPH_AUTH_TOKEN_FILE: /data/auth-token
      GRAPH_ALLOW_PLAINTEXT: "true"
      # graph-node's async query futures exceed the default thread stack;
      # without this it serves /readyz then aborts on the first query.
      RUST_MIN_STACK: "33554432"
    volumes:
      - ./hydradb-data:/data
