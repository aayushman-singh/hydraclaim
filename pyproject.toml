[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "hydraclaim"
version = "0.2.0"
description = "Conflict-aware temporal memory for AI agents, built on HydraDB."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Aayushman Singh", email = "aayushman@example.com" },
]
keywords = [
    "agent-memory",
    "knowledge-graph",
    "temporal-memory",
    "hydradb",
    "conflict-resolution",
    "bitemporal",
    "rag",
    "llm",
    "graph-database",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/aayushman-singh/hydraclaim"
Repository = "https://github.com/aayushman-singh/hydraclaim"
Demo = "https://hydraclaim.vercel.app"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
markers = [
    "artifact: tests that inspect built wheel or source archive",
]

[project.scripts]
hydraclaim = "hydraclaim.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["hydraclaim"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/tests",
    "/hydradb-data/**",
    "/.superpowers/**",
    "/.claude/**",
    "/.playwright-mcp/**",
    "/docs/agents/**",
    "/docs/superpowers/**",
    "/AGENTS.md",
    "/CONTEXT.md",
    "/PLAN.md",
    "/task-*-brief.md",
    "/task-*-report.md",
    "/data/sessions/**",
    "/data/longmemeval/**",
    "/results/**",
    "/*.egg-info/**",
    "/**/*.egg-info/**",
    "/**/auth-token",
    "/**/token",
    "/**/credential",
    "/**/credentials",
    "/**/key",
    "/**/*.token",
    "/**/*.credential",
    "/**/*.credentials",
    "/**/*.key",
    "/.env",
    "/.env.*",
    "/**/*.env",
    "/**/*.env.*",
    "/.env.*/**",
    "/.pytest_cache/**",
    "/.ruff_cache/**",
    "/.mypy_cache/**",
    "/.hypothesis/**",
    "/.tox/**",
    "/.nox/**",
    "/.cache/**",
    "/__pycache__/**",
    "/**/__pycache__/**",
    "/.worktrees/**",
    "/worktrees/**",
    "/build/**",
    "/dist/**",
    "/.venv/**",
    "/.venv-package-test/**",
    "/venv/**",
    "/env/**",
    "/demo/*.mp4",
    "/demo/*.png",
    "/demo/*-output.txt",
    "/demo/thumb*.jpg",
    "/demo/test-capture.mp4",
    "/.DS_Store",
    "/Thumbs.db",
]
